<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercado Pago Checkout Pro</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://sdk.mercadopago.com/js/v2"></script>
</head>
<body>
    <section class="py-2">
        <div class="container px-4 px-lg-5 my-3">
            <div class="row gx-4 gx-lg-5 align-items-center">
                <div class="col-md-6"><img class="card-img-top mb-5 mb-md-0" src="images/balon.jpg" alt="Balón" /></div>
                <div class="col-md-6">
                    <div class="small mb-1">SKU: DEP-0001</div>
                    <h1 class="display-5 fw-bolder">Balón de Futbol</h1>
                    <div class="fs-5 mb-5">
                        <span>$550.00</span>
                    </div>
                    <p class="lead">Elaborado con altos estándares de calidad, 4 capas que permite mayor duración.</p>
                    <div class="d-flex">
                        <div id="wallet_container"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const mp = new MercadoPago('APP_USR-a294acdc-355e-44b8-a2b9-6df401a8f2ab', {
            locale: 'es-MX'
        });

        fetch('get_preference.php')
            .then(response => response.json())
            .then(data => {
                if (!data.id) {
                    document.getElementById('wallet_container').innerHTML = '<div class="alert alert-danger">No se pudo obtener el preferenceId.</div>';
                    return;
                }
                mp.bricks().create("wallet", "wallet_container", {
                    initialization: {
                        preferenceId: data.id,
                        redirectMode: 'self'
                    },
                    customization: {
                        texts: {
                            action: "pay",
                            valueProp: 'security_safety',
                        },
                    },
                });
            })
            .catch(error => {
                document.getElementById('wallet_container').innerHTML = '<div class="alert alert-danger">Error al conectar con el servidor.</div>';
                console.error(error);
            });
    </script>
</body>
</html>
